<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Swarm</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <main class="login" id="login" hidden>
    <div class="login-panel">
      <p class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Swarm</span></p>
      <h1>Pick a nick and start talking</h1>
      <p class="login-lead">Channels, nicks and slash commands, with history that waits for you.</p>
      <form id="login-form" autocomplete="on" novalidate>
        <div class="segmented" role="radiogroup" aria-label="How to connect">
          <label><input type="radio" name="mode" value="guest" checked><span>Guest</span></label>
          <label><input type="radio" name="mode" value="signin"><span>Sign in</span></label>
          <label><input type="radio" name="mode" value="register"><span>Register</span></label>
        </div>
        <label class="field">
          <span>Nick</span>
          <input name="nick" type="text" required minlength="2" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
        </label>
        <label class="field" id="password-field" hidden>
          <span>Password</span>
          <input name="password" type="password" minlength="8" maxlength="200" autocomplete="current-password">
        </label>
        <p class="login-hint" id="login-hint"></p>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="button primary" type="submit">Connect</button>
      </form>
      <p class="login-irc" id="login-irc" hidden></p>
    </div>
  </main>

  <div class="shell" id="chat" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Conversations"></aside>
    <section class="main">
      <header class="topbar" id="topbar"></header>
      <div class="log" id="log" role="log" tabindex="0" aria-label="Messages"></div>
      <button class="jump-latest" id="jump-latest" type="button" hidden>New messages</button>
      <p class="typing" id="typing" aria-live="polite"></p>
      <form class="composer" id="composer">
        <div class="composer-context" id="composer-context" hidden></div>
        <div class="composer-box">
          <textarea id="input" rows="1" maxlength="4000" autocomplete="off" aria-label="Message"></textarea>
          <button class="send" type="submit" aria-label="Send" title="Send"></button>
        </div>
        <ul class="complete" id="complete" role="listbox" hidden></ul>
      </form>
    </section>
    <aside class="members" id="members" aria-label="People"></aside>
    <div class="scrim" id="scrim"></div>
  </div>

  <div id="layer"></div>
  <noscript><p class="noscript">Swarm needs JavaScript in the browser. Any IRC client works without it.</p></noscript>
</body>
</html>
